<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-label="How ranking a Wait List against a Confirmed Offer works. Rank the Wait List school above the Confirmed Offer and you win either way: you get School A if a seat opens, and still get School B if none does. Rank the Confirmed Offer first and the Wait List can never convert.">
  <rect width="820" height="392" fill="#f8f6f1"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0d3f5f">The order decides everything</text>
  <text x="40" y="72" font-size="14.5" fill="#4a7a9b">A = the school you wanted (Wait List)   ·   B = the safe school (Confirmed Offer)</text>

  <!-- LEFT card: the smart move -->
  <rect x="40" y="96" width="350" height="256" rx="16" fill="#ffffff" stroke="#c6a24a" stroke-width="2"/>
  <rect x="40" y="96" width="350" height="46" rx="16" fill="#c6a24a"/>
  <rect x="40" y="120" width="350" height="22" fill="#c6a24a"/>
  <text x="215" y="125" text-anchor="middle" font-size="15.5" font-weight="700" fill="#082c44">Rank A (Wait List) above B</text>

  <text x="66" y="188" font-size="14" fill="#0d3f5f">Seat opens at A</text>
  <path d="M188 183 l14 0" stroke="#4a7a9b" stroke-width="1.5"/><path d="M202 183 l-5 -3 v6 z" fill="#4a7a9b"/>
  <text x="214" y="188" font-size="14" font-weight="600" fill="#0d3f5f">School A</text>
  <path d="M344 179 l5 6 l10 -13" stroke="#c6a24a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="66" y="232" font-size="14" fill="#0d3f5f">No seat opens</text>
  <path d="M188 227 l14 0" stroke="#4a7a9b" stroke-width="1.5"/><path d="M202 227 l-5 -3 v6 z" fill="#4a7a9b"/>
  <text x="214" y="232" font-size="14" font-weight="600" fill="#0d3f5f">still School B</text>
  <path d="M344 223 l5 6 l10 -13" stroke="#c6a24a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="66" y1="260" x2="364" y2="260" stroke="#efe9db" stroke-width="1.5"/>
  <rect x="66" y="290" width="298" height="40" rx="20" fill="#faf5e8"/>
  <text x="215" y="315" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a7d38">Win either way — no downside</text>

  <!-- RIGHT card: the mistake -->
  <rect x="430" y="96" width="350" height="256" rx="16" fill="#ffffff" stroke="#dcd5c7" stroke-width="2"/>
  <rect x="430" y="96" width="350" height="46" rx="16" fill="#eef0f2"/>
  <rect x="430" y="120" width="350" height="22" fill="#eef0f2"/>
  <text x="605" y="125" text-anchor="middle" font-size="15.5" font-weight="700" fill="#4a7a9b">Rank B (Confirmed) above A</text>

  <text x="456" y="188" font-size="14" fill="#0d3f5f">Your child gets School B</text>

  <text x="456" y="232" font-size="14" fill="#6b6456">Wait List at A can never convert</text>
  <path d="M735 223 l12 12 M747 223 l-12 12" stroke="#b0a894" stroke-width="3" stroke-linecap="round"/>

  <line x1="456" y1="260" x2="754" y2="260" stroke="#efe9db" stroke-width="1.5"/>
  <rect x="456" y="290" width="298" height="40" rx="20" fill="#f2efe8"/>
  <text x="605" y="315" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6b6456">You close the door yourself</text>

  <text x="40" y="376" font-size="11" fill="#a8a08c">Mechanics per MOE: Confirmed Offers are placed before Wait Lists are reached · dsalink.sg</text>
</svg>
